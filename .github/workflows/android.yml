name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          curl -fL -o ltw-release.aar https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JREs
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/pojavlauncher-release.apk \
            https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          mkdir -p /tmp/pojavlauncher-assets
          unzip -q /tmp/pojavlauncher-release.apk 'assets/components/jre*' -d /tmp/pojavlauncher-assets
          mkdir -p app_pojavlauncher/src/main/assets/components
          cp -r /tmp/pojavlauncher-assets/assets/components/jre* app_pojavlauncher/src/main/assets/components/
          ls -la app_pojavlauncher/src/main/assets/components/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon --parallel --max-workers=4 --build-cache

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --parallel --max-workers=4 --build-cache
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Generate md5
        run: md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*
